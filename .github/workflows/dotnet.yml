name: Build & Release

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CONFIGURATION: Release

jobs:
  build:
    name: Build installer
    runs-on: windows-2022
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup Advanced Installer
        uses: caphyon/advinst-github-action@main
        with:
          advinst-version: '23.6'
          # advinst-license: ${{ secrets.ADVINST_LICENSE_KEY }}

      - name: Restore packages
        run: dotnet restore FenixModbusS7.sln

      - name: Build & publish FenixModbusS7
        run: dotnet publish FenixModbusS7/FenixModbusS7.csproj -c ${{ env.CONFIGURATION }} -p:PublishProfile=Properties/PublishProfiles/FolderProfile.pubxml --no-restore

      - name: Build FenixServer.Web
        run: msbuild FenixServer.Web/FenixServer.Web.csproj -p:Configuration=${{ env.CONFIGURATION }} -p:Platform="Any CPU" -m

      - name: Publish FenixServer.Web
        run: dotnet publish FenixServer.Web/FenixServer.Web.csproj -c ${{ env.CONFIGURATION }} -p:PublishProfile=Properties/PublishProfiles/FolderProfile.pubxml --no-restore

      - name: Build FenixServerS7
        run: msbuild FenixServerS7/FenixServerS7.csproj -p:Configuration=${{ env.CONFIGURATION }} -p:Platform=x86 -m

      - name: Publish FenixServerS7
        run: dotnet publish FenixServerS7/FenixServerS7.csproj -c ${{ env.CONFIGURATION }} -p:Platform=x86 -p:PublishProfile=Properties/PublishProfiles/FolderProfile.pubxml --no-restore

      - name: Build MSI installer
        run: msbuild FenixModbusS7Setup/FenixModbusS7Setup.aiproj -p:Configuration=${{ env.CONFIGURATION }} -p:BuildProjectReferences=false -m

      - name: Read version
        id: version
        run: |
          [xml]$xml = Get-Content version.xml
          echo "value=$($xml.Fenix.version)" >> $env:GITHUB_OUTPUT

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: FenixModbusS7-installer-v${{ steps.version.outputs.value }}
          path: FenixModbusS7Setup/FenixModbusS7Setup-SetupFiles/FenixModbusS7Setup.msi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Release v${{ steps.version.outputs.value }}
          files: FenixModbusS7Setup/FenixModbusS7Setup-SetupFiles/FenixModbusS7Setup.msi
          token: ${{ secrets.GITHUB_TOKEN }}
